# Save in your repo as .github/workflows/ty-jerome-live.yml (replace the old one)
name: Ty Jerome Live

on:
  schedule:
    # Hourly from ~9am to ~1am Chicago time. Runs with nothing to watch exit in seconds.
    - cron: "0 14-23 * * *"
    - cron: "0 0-6 * * *"
  workflow_dispatch:
    inputs:
      game_id:
        description: "Optional: NBA gameId to replay right now (test mode)"
        required: false

permissions:
  contents: write   # lets the job save state.json back to the repo

# One watcher at a time; the next run waits its turn, then resumes from state.json.
concurrency:
  group: ty-jerome-live
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Watch games
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          GAME_ID: ${{ github.event.inputs.game_id }}
        run: python ty_jerome_live.py

      - name: Save state
        if: always() && !github.event.inputs.game_id
        run: |
          [ -f state.json ] || exit 0
          git config user.name "ty-jerome-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet && exit 0
          git commit -m "Update watcher state [skip ci]"
          for i in 1 2 3; do
            git pull --rebase --quiet origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            echo "push attempt $i failed, retrying"; sleep 5
          done
          echo "::error::Could not save state.json. Check Settings > Actions > General > Workflow permissions = Read and write."
          exit 1
